name: Actualizar noticias

on:
  schedule:
    # Respaldo: si el ciclo rápido se corta, esto lo vuelve a enganchar.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/**"
      - "docs/clave.js"

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Generar noticias
        working-directory: scraper
        run: python -m monitoreo.build

      - name: Publicar cambios
        run: |
          git config user.name "monitoreo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "noticias: $(date -u +%FT%TZ)"
            git push
          fi

      # Ciclo rápido: espera ~9 min y vuelve a dispararse.
      # Solo se activa si existe el secret LOOP_TOKEN (token fine-grained con
      # permiso "Actions: read and write" sobre este repo). Sin ese secret,
      # este paso no hace nada y el workflow corre solo con el schedule.
      - name: Reenganchar el ciclo
        if: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ secrets.LOOP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Sin LOOP_TOKEN: ciclo rápido inactivo (solo corre el schedule cada 20 min)."
            exit 0
          fi
          sleep 570
          gh workflow run actualizar.yml --repo "${{ github.repository }}" --ref main
