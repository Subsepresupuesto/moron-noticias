name: Actualizar noticias

on:
  schedule:
    # Arranca (y reengancha) el ciclo. GitHub puede demorarlo, pero como cada
    # corrida dura ~50 min, el hueco entre una y otra es chico.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/**"
      - "docs/clave.js"

permissions:
  contents: write

concurrency:
  # Nunca corren dos a la vez; el que entra reemplaza al que está en cola.
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Ciclo de actualización (~50 min, una pasada cada 10)
        run: |
          git config user.name "monitoreo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FIN=$(( $(date +%s) + 3000 ))   # ~50 minutos
          N=0
          while [ "$(date +%s)" -lt "$FIN" ]; do
            N=$((N+1))
            echo "::group::Pasada $N"
            ( cd scraper && python -m monitoreo.build ) || echo "pasada con error, sigue"
            git add docs/data
            if git diff --staged --quiet; then
              echo "sin cambios"
            else
              git commit -m "noticias: $(date -u +%FT%TZ)"
              git push || { git pull --rebase --autostash && git push; }
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -lt "$FIN" ] && sleep 600
          done
