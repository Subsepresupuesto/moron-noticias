name: Actualizar noticias

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/**"
      - "docs/clave.js"

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Generar noticias
        working-directory: scraper
        run: python -m monitoreo.build

      - name: Publicar cambios
        run: |
          git config user.name "monitoreo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "noticias: $(date -u +%FT%TZ)"
            git push
          fi
